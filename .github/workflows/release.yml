name: Release APK

# Ogni push su main compila il sorgente di src/ e pubblica una release firmata
# con la versione incrementata. La prima build della storia è la 1.0.0.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # storia completa: la versione deriva dal numero di commit

      - name: Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Calcola versione
        id: ver
        run: |
          BUILD="$(git rev-list --count HEAD)"
          NAME="1.0.$(( BUILD - 1 ))"          # il primo commit pubblica la 1.0.0
          # Sempre crescente e sopra le versionCode già distribuite (max 1206):
          # l'aggiornamento in-place non torna mai indietro.
          CODE=$(( 1300 + BUILD ))
          {
            echo "build=$BUILD"
            echo "name=$NAME"
            echo "code=$CODE"
            echo "tag=v$NAME"
          } >> "$GITHUB_OUTPUT"
          echo "Versione: $NAME (versionCode $CODE)"

      - name: Cache toolchain
        uses: actions/cache@v4
        with:
          path: .tools
          key: tools-apktool-3.0.3-bt35

      - name: Prepara la chiave di firma
        env:
          KEYSTORE_B64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          mkdir -p keys
          printf '%s' "$KEYSTORE_B64" | base64 -d > keys/spotivy.keystore
          test -s keys/spotivy.keystore

      - name: Build + firma
        env:
          VERSION_CODE: ${{ steps.ver.outputs.code }}
          VERSION_NAME: ${{ steps.ver.outputs.name }}
          KS_PASS: ${{ secrets.SIGNING_STORE_PASSWORD }}
          KEY_PASS: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          tools/build.sh
          ls -la dist/

      - name: Verifica APK
        run: |
          export PATH="$PWD/.tools/android-35:$PATH"
          APK="$(ls -1 dist/*.apk | head -1)"
          aapt2 dump badging "$APK" | grep -E "^package|application-label:"
          apksigner verify --print-certs "$APK" | head -3
          VN="$(aapt2 dump badging "$APK" | grep -oE "versionName='[^']+'" | head -1)"
          case "$VN" in
            *"${{ steps.ver.outputs.name }}"*) echo "versionName OK: $VN" ;;
            *) echo "versionName inatteso: $VN"; exit 1 ;;
          esac

      - name: Cancella le release precedenti
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release list --limit 100 --json tagName -q '.[].tagName' |
            while read -r tag; do
              [[ -n "$tag" ]] || continue
              echo "elimino $tag"
              gh release delete "$tag" --yes --cleanup-tag || true
            done
          # un tag vecchio rimasto nel clone locale bloccherebbe la creazione
          git tag -l | xargs -r git tag -d
          git fetch --prune --prune-tags --force origin >/dev/null 2>&1 || true

      - name: Pubblica la release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.ver.outputs.tag }}
          NAME: ${{ steps.ver.outputs.name }}
          CODE: ${{ steps.ver.outputs.code }}
        run: |
          ASSET="$(ls -1 dist/*.apk | head -1)"
          {
            echo "Build automatica dal commit \`${GITHUB_SHA::7}\`."
            echo
            echo "- versione: **$NAME** (versionCode \`$CODE\`)"
            echo "- sorgente: [\`src/\`](https://github.com/${GITHUB_REPOSITORY}/tree/main/src)"
            echo "- l'app si aggiorna da sola da questa release (*Impostazioni → Info*)"
            echo
            echo "Installazione manuale (solo la prima volta):"
            echo
            echo '```'
            echo "adb install -r $(basename "$ASSET")"
            echo '```'
            echo
            echo "Se Spotivy è già installata con questa firma, l'aggiornamento arriva da solo."
          } > notes.md
          gh release create "$TAG" "$ASSET" --target "$GITHUB_SHA" \
            --title "Spotivy v$NAME" --notes-file notes.md --latest

      - name: Allega artifact del run
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: spotivy-${{ steps.ver.outputs.name }}
          path: dist/*.apk
          if-no-files-found: warn
